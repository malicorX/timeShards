name: CI

env:
  # Cargo writes progress to stderr; do not fail PowerShell steps on NativeCommandError.
  PSNativeCommandUseErrorActionPreference: false

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: cargo check
        run: cargo check --workspace
      - name: hardware unit tests
        run: cargo test -p timeshards-hardware

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check -w @timeshards/server
      - run: npm run check -w @timeshards/client

  pilot-gate:
    runs-on: windows-latest
    needs: [rust, frontend]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build API for smoke
        run: cargo build -q --bin timeshards-api
      - name: Pilot gate (check + DB tests + API + production smoke)
        run: npm run ship

  smoke-integration:
    runs-on: windows-latest
    needs: [rust]
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build API for smoke
        run: cargo build -q --bin timeshards-api
      - name: External hardware adapter smoke
        run: npm run smoke:hw-external

  smoke-strict:
    runs-on: windows-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build API for smoke
        run: cargo build -q --bin timeshards-api
      - name: Strict default-password smoke
        run: npm run smoke:strict

  smoke-hw-unknown:
    runs-on: windows-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build API for smoke
        run: cargo build -q --bin timeshards-api
      - name: Invalid HW adapter falls back to sim
        run: npm run smoke:hw-unknown
